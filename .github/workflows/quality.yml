name: quality

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills, JSON and README links
        run: |
          python3 - <<'EOF'
          import glob, json, os, re, sys

          errors = []

          for path in sorted(glob.glob("skills/*/SKILL.md")):
              text = open(path, encoding="utf-8").read()
              m = re.match(r"---\n(.*?)\n---", text, re.S)
              if not m:
                  errors.append(f"{path}: missing YAML frontmatter")
                  continue
              front = m.group(1)
              if "name:" not in front:
                  errors.append(f"{path}: frontmatter missing name:")
              if "description:" not in front:
                  errors.append(f"{path}: frontmatter missing description:")
                  continue
              desc = re.search(r"description:\s*(.*)", front).group(1).strip()
              if len(desc) > 1024:
                  errors.append(f"{path}: description is {len(desc)} chars (max 1024)")

          for path in sorted(glob.glob("**/*.json", recursive=True)):
              if ".git/" in path:
                  continue
              try:
                  json.load(open(path, encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{path}: invalid JSON ({exc})")

          readme = open("README.md", encoding="utf-8").read()
          for link in sorted(set(re.findall(r"\(([^)]+\.md[^)]*)\)", readme))):
              target = link.split("#")[0]
              if target.startswith("http"):
                  continue
              if not os.path.exists(target):
                  errors.append(f"README.md: link target missing: {target}")

          if errors:
              print("FAIL: quality checks failed")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          print("PASS: all quality checks passed")
          EOF
      - name: Check relative links and markdown style
        run: |
          python3 - <<'EOF'
          import glob, os, re, sys

          errors = []

          # (a) Relative .md links must resolve to a real file.
          # Only real markdown links [text](target) are checked, not
          # backtick references: many of those are files the user creates
          # on their own machine (.cursor/rules/frappe.md, GEMINI.md)
          # or placeholders (skills/<kebab-case-name>/SKILL.md).
          link_files = (
              sorted(glob.glob("skills/**/*.md", recursive=True))
              + sorted(glob.glob("agents/*.md"))
              + sorted(glob.glob("commands/*.md"))
              + ["README.md"]
          )
          for path in link_files:
              text = open(path, encoding="utf-8").read()
              for link in sorted(set(re.findall(r"\[[^\]]*\]\(([^)]+)\)", text))):
                  target = link.split("#")[0].strip()
                  if not target or not target.endswith(".md"):
                      continue
                  if target.startswith(("http://", "https://", "mailto:")):
                      continue
                  base = os.path.dirname(path)
                  if os.path.exists(os.path.join(base, target)):
                      continue
                  if os.path.exists(target):
                      continue
                  errors.append(f"{path}: relative link target missing: {target}")

          # (b) Basic markdown lint: no trailing whitespace, headings
          # in order (never jump more than one level, e.g. H1 -> H3).
          # Fenced code blocks and YAML frontmatter are skipped.
          for path in sorted(glob.glob("**/*.md", recursive=True)):
              if ".git/" in path:
                  continue
              lines = open(path, encoding="utf-8").read().splitlines()
              in_fence = False
              in_frontmatter = False
              prev_level = 0
              for i, line in enumerate(lines, 1):
                  stripped = line.strip()
                  if i == 1 and stripped == "---":
                      in_frontmatter = True
                      continue
                  if in_frontmatter:
                      if stripped == "---":
                          in_frontmatter = False
                      continue
                  if stripped.startswith("```"):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  if line != line.rstrip():
                      errors.append(f"{path}:{i}: trailing whitespace")
                  m = re.match(r"^(#{1,6})\s", line)
                  if m:
                      level = len(m.group(1))
                      if prev_level and level > prev_level + 1:
                          errors.append(
                              f"{path}:{i}: heading jumps H{prev_level} -> H{level}"
                          )
                      prev_level = level

          if errors:
              print("FAIL: link and markdown checks failed")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          print("PASS: all link and markdown checks passed")
          EOF
